# v4 シャドーランナー (T68, Issue #91) の固定回帰セット.
#
# Issue #88 の三層測定のうち②③をここに固定する (①当日実台本は shadow_v4_run.py が
# episode_drafts から都度構築する)。番組の実文体 (HAL 人格, docs/hal-persona.md) で
# 自作しており、実サーバへの依存なしにレビュー・差分確認できる。
#
# 各文は shadow_v4_run.py の prepare_tts_text (読み辞書適用) を経由してから TTS へ渡る。
# stratified の文字数バケットは「読み辞書適用後のおおよその字数」を目安に構成している
# (中国固有名詞は読み辞書のカナ表記, カッコ内 ASCII グロスは合成前に自動除去されるため)。
# 実際の字数は読み辞書の内容に依存しうるが、バケットはあくまで層化の目安であり
# 判定ロジックはバケットラベルに依存しない。

# 既知失敗文 (Issue #86 の実測 2 文 + 同種の番組固定フレーズ)。いずれも毎エピソード
# 必ず読み上げられる短文で、v4 の duration predictor 過大予測 (短文終端の幻話) の
# 実害が最も大きいカテゴリ (Issue #88 根本原因診断)。
known_failures:
  - "キャスターのハルです。"
  - "今日の華流テック通信は以上です。"
  - "それでは皆さん、良い一日を。"
  - "ハルでした。"
  - "続いては、"
  - "もう一つ、"
  - "最後は、"
  - "これは噂レベルですが。"
  - "本日の華流テック通信、始めます。"
  - "以上、華流テック通信でした。"

# 層化短文回帰セット (Issue #88): 4-8 / 9-12 / 13-16 / 17-24 字 ×
# 数字 (digits) / 英字略語 (ascii_abbrev) / 中国固有名詞 (chinese_name) /
# 括弧 (parens) / 引用 (quote) / 基準文 (baseline) の 6 カテゴリ。
stratified:
  "4-8":
    baseline: "驚きです。"
    digits: "2027年です。"
    ascii_abbrev: "AIです。"
    chinese_name: "バイドゥです。"
    parens: "ハル（HAL）です。"
    quote: "「独占」です。"
  "9-12":
    baseline: "本日も配信します。"
    digits: "出荷台数は500万台。"
    ascii_abbrev: "新型GPUを発表。"
    chinese_name: "バイトダンスが投資へ。"
    parens: "アリババ（Alibaba）が新規投資へ。"
    quote: "「独占契約」だそうです。"
  "13-16":
    baseline: "本日も張り切って参ります。"
    digits: "来年の2027年に発表予定。"
    ascii_abbrev: "新型GPUの発表がありました。"
    chinese_name: "ファーウェイが新製品を発表。"
    parens: "テンセント（Tencent）がゲーム新作を発表。"
    quote: "「独占先行配信」が正式に決定。"
  "17-24":
    baseline: "本日も張り切ってお伝えしていきます。"
    digits: "来年の2027年に発表される見込みです。"
    ascii_abbrev: "新型GPUを搭載したモデルを発表。"
    chinese_name: "バイトダンス傘下のTikTokが新機能を発表。"
    parens: "アリババ（Alibaba）が新たな大型投資計画を発表。"
    quote: "「独占先行配信」が正式に決定しました。"
