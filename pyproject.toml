[project]
# 配布名はリポジトリ名に合わせ panda-tech-news。Python モジュール名は karyu_tech_news
# (全ドキュメント/CLI 例と一致。PROJECT_STATE.md の確定事項)。
name = "panda-tech-news"
version = "0.1.0"
description = "華流テック通信 by HAL - 中華圏特化 AI ポッドキャストの収集・台本生成・配信パイプライン"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "karyu-tech-news maintainers" }]
dependencies = [
    "typer>=0.12.3",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "sqlalchemy>=2.0.29",
]

# 音声化 (Sprint 2) は optional。コア (収集→台本) は依存最小のまま保つ (§5)。
# `uv sync --extra tts` で導入。ONNX ベースで torch 不要・Apple Silicon で動く。
[project.optional-dependencies]
tts = [
    "kokoro-onnx>=0.4.0",
    "pydub>=0.25.1",  # T29 BGM ミックス (ffmpeg ラッパー、素材があるときのみ使用)
]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
karyu = "karyu_tech_news.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karyu_tech_news"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
# B008: typer は Option()/Argument() を引数デフォルトに使う設計のため除外
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

# kokoro-onnx は optional 依存。未導入 (extra tts なし) の環境でも import-not-found で
# strict が落ちないよう missing import を許容する。コードは `from kokoro_onnx import Kokoro`
# のトップレベル import のみ行う。`kokoro_onnx.*` (サブモジュール) は未使用で
# warn_unused_configs のノイズになるため、トップレベルのみ指定する (Copilot 指摘)。
[[tool.mypy.overrides]]
module = "kokoro_onnx"
ignore_missing_imports = true

# pydub は型スタブ無し (optional extra `tts`, T29 BGM ミックスで遅延 import)。
[[tool.mypy.overrides]]
module = "pydub"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
