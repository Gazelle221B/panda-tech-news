# 華流テック通信 by HAL - LLM プロファイル定義
# Sprint 1B 以降で使用 (FR-003)。tc-newsflow の LLMProfile 思想を継承 (ADR-0001, design-inheritance §2)。
# Sprint 1A の collect パイプラインからは参照しない (ADR-0002)。
#
# 設計: OpenAI 互換 API を最大公約数とし、profile 単位で provider を切替。
#       editor (編集判定) と writer (台本生成) を別 profile に分離できる構造 (A/B/C 検証, ADR-0005)。
# api_key_env は実キーではなく環境変数名を指す (.env で実値を管理)。

profiles:
  # ---- DeepSeek (台本生成の第一候補: コスト最優先) ----
  - label: deepseek
    provider: openai_compatible
    api_key_env: DEEPSEEK_API_KEY
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-v4-flash"      # 2026-08-02 V4-Flash-0731 リリースに伴い更新 (API /models の正式 ID、疎通スモーク済み)
    max_tokens: 1800
    temperature: 0.3
    notes: "中国語ネイティブ。コスト効率最強クラス。writer 候補。"

  # ---- Xiaomi MiMo (編集判定の第一候補: 中国文脈理解・長コンテキスト) ----
  - label: mimo
    provider: openai_compatible
    api_key_env: MIMO_API_KEY
    base_url: "https://api.xiaomimimo.com/v1"  # T13 確定 (2026-06-12, platform.xiaomimimo.com 公式)
    model: "mimo-v2.5-pro"          # T13 確定: 公式ドキュメント記載の ID
    max_tokens: 1800
    temperature: 0.2
    notes: "Token Plan サブスク前提。editor (スコアリング/編集判定) 候補。"

  # ---- OpenAI GPT-5.6 Luna (編集判定の新第一候補: データ共有キャンペーン枠, T64/Issue #70) ----
  - label: openai-luna
    provider: openai_compatible
    api_key_env: OPENAI_API_KEY
    base_url: "https://api.openai.com/v1"
    model: "gpt-5.6-luna"           # 2026-08-02 実機スモーク済み (models 一覧に存在、chat completions 応答 OK)
    max_tokens: 1800
    token_param: max_completion_tokens  # 2026-08-02 実測: max_tokens は unsupported_parameter で reject
    temperature: 1.0                # 実際は未送信 (send_temperature: false)。モデル既定値 (1 のみ許可) を形式上保持
    send_temperature: false         # 2026-08-02 実測: temperature 指定不可 (既定 1 のみ、0.2 も 0 も reject) → 省略必須
    seed: 42                        # best-effort 決定性補完 (fingerprint は None)。temp=0 固定 (T15) が使えないトレードオフ
    notes: "OpenAI データ共有キャンペーン枠 (API入出力共有と引き換えに日次無料トークン)。editor が送るのは公開RSS見出し・要約のみで共有可能。温度固定不可のため決定性は seed の best-effort に留まる (judge の JSON 崩れは既存 fail-open が吸収, Issue #70)。"

  # ---- OpenRouter 経由 (海外決済フォールバック) ----
  - label: mimo-openrouter
    provider: openai_compatible
    api_key_env: OPENROUTER_API_KEY
    base_url: "https://openrouter.ai/api/v1"
    model: "xiaomi/mimo-v2-flash"   # 実 model ID は要確認
    max_tokens: 1800
    temperature: 0.2
    notes: "MiMo の海外契約が困難な場合のフォールバック。"

  # ---- ローカル Ollama (オフライン検証用) ----
  - label: local-ollama
    provider: ollama
    api_key_env: ""                 # 不要
    base_url: "http://localhost:11434/v1"
    model: "qwen3"
    max_tokens: 1800
    temperature: 0.3
    notes: "Ollama 互換。reasoning_effort=none / think=false を強制 (design-inheritance §6)。"

# Sprint 1B の A/B/C 検証マッピング (ADR-0005)。確定後も切替機構は保持する。
ab_test:
  A: { editor: openai-luna, writer: deepseek }  # 2026-08-02 T64: mimo → openai-luna (キャンペーン枠, Issue #70)。mimo はフォールバックで残置
  B: { editor: mimo,     writer: mimo }
  C: { editor: deepseek, writer: mimo }
  # 評価軸: 採用率 / 修正回数 / 読み上げ自然さ / コスト / JSON安定性 / AI要約臭
